version: 1.3.15

endpoints:
  custom:
    - name: "HuggingFace"
      apiKey: "${HUGGINGFACE_TOKEN}"
      baseURL: "https://router.huggingface.co/v1"
      models:
        default:
          - "meta-llama/Meta-Llama-3-8B-Instruct:fastest"
          - "mistralai/Mistral-7B-Instruct-v0.2:fastest"
          - "google/gemma-1.1-7b-it:fastest"
          - "HuggingFaceH4/zephyr-7b-beta"
          - "Qwen/Qwen3.8-27B:fastest"
          - "zai-org/GLM-5.3-Flash:fastest"
          - "zai-org/GLM-5.3:fastest"
          - "moonshotai/Kimi-K3:fastest"
        fetch: false
      stream: false
      dropParams: ["top_p", "presence_penalty", "frequency_penalty", "stop"]
